<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1214" />
      <stop offset="100%" stop-color="#050809" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1de9b6" />
      <stop offset="100%" stop-color="#00897b" />
    </linearGradient>
    <linearGradient id="idleBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2cd4bf" />
      <stop offset="100%" stop-color="#147466" />
    </linearGradient>
    <linearGradient id="activeBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7b89" />
      <stop offset="100%" stop-color="#e14255" />
    </linearGradient>
  </defs>

  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="120"
    fill="url(#bgGrad)"
    stroke="url(#borderGrad)"
    stroke-width="12"
  />

  <path
    d="M 230 148 Q 256 120 282 148"
    fill="none"
    stroke="#ff7b89"
    stroke-width="7"
    stroke-linecap="round"
    stroke-dasharray="2 12"
  />

  <g id="bars">
    <rect x="88" y="270" width="44" height="122" rx="14" fill="url(#idleBar)" />
    <rect x="150" y="210" width="44" height="182" rx="14" fill="url(#idleBar)" />
    <rect x="212" y="160" width="44" height="232" rx="14" fill="url(#activeBar)" />
    <rect x="274" y="235" width="44" height="157" rx="14" fill="url(#activeBar)" />
    <rect x="336" y="130" width="44" height="262" rx="14" fill="url(#idleBar)" />
    <rect x="398" y="80" width="44" height="312" rx="14" fill="url(#idleBar)" />
  </g>
</svg>